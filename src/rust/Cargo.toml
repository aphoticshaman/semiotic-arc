[package]
name = "semiotic-arc"
version = "0.1.0"
edition = "2021"
description = "Semiotic Reasoning Engine for Abstract Visual Tasks"
license = "MIT"
repository = "https://github.com/crystalline-labs/semiotic-arc"
authors = ["Ryan Cardwell <ryan@crystallinelabs.com>"]
keywords = ["artificial-intelligence", "visual-reasoning", "semiotics", "arc-agi"]
categories = ["algorithms", "science"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
wasm = ["wasm-bindgen", "console_error_panic_hook", "wee_alloc"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
hashbrown = "0.14"
smallvec = "1.11"
arrayvec = "0.7"
bitflags = "2.4"
thiserror = "1.0"

# WASM dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
